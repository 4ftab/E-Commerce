<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f5f1"/><stop offset="1" stop-color="#cfe8e1"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fb39a"/><stop offset="0.5" stop-color="#1f9a84"/><stop offset="1" stop-color="#177b69"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- floor shadow -->
  <ellipse cx="300" cy="470" rx="230" ry="26" fill="#000" opacity="0.10"/>
  <!-- unrolled tail of the mat -->
  <path d="M120 330 L120 420 L470 440 L470 350 Z" fill="#26a58d"/>
  <path d="M120 420 L470 440 L470 450 L120 430 Z" fill="#146a5a"/>
  <!-- rolled body -->
  <rect x="110" y="170" width="360" height="190" rx="14" fill="url(#mat)"/>
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="3">
    <line x1="110" y1="200" x2="470" y2="200"/><line x1="110" y1="235" x2="470" y2="235"/>
    <line x1="110" y1="270" x2="470" y2="270"/><line x1="110" y1="305" x2="470" y2="305"/>
    <line x1="110" y1="340" x2="470" y2="340"/>
  </g>
  <!-- spiral end -->
  <ellipse cx="470" cy="265" rx="50" ry="95" fill="#1f9a84"/>
  <ellipse cx="470" cy="265" rx="50" ry="95" fill="none" stroke="#146a5a" stroke-width="4"/>
  <ellipse cx="470" cy="265" rx="38" ry="75" fill="none" stroke="#146a5a" stroke-width="4"/>
  <ellipse cx="470" cy="265" rx="26" ry="55" fill="none" stroke="#146a5a" stroke-width="4"/>
  <ellipse cx="470" cy="265" rx="14" ry="33" fill="none" stroke="#146a5a" stroke-width="4"/>
  <ellipse cx="470" cy="265" rx="5" ry="12" fill="#146a5a"/>
  <!-- strap -->
  <rect x="215" y="165" width="34" height="200" rx="6" fill="#f2b84b"/>
  <rect x="215" y="165" width="34" height="200" rx="6" fill="none" stroke="#c98f1c" stroke-width="3"/>
  <rect x="207" y="250" width="50" height="30" rx="5" fill="#e0a02a" stroke="#b9801a" stroke-width="3"/>
  <!-- text -->
  <text x="300" y="540" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#146a5a" text-anchor="middle">Yoga Mat Premium</text>
</svg>
